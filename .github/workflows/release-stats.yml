name: Refresh release download counts

# GitHub's release page never shows how often an asset was downloaded — the
# number exists only in the API (`assets[].download_count`). To surface it on
# the page we render it into the release body ourselves, inside the marker
# block that build/release-tail.md.tmpl reserves between
# `downloads-stats-start` and `downloads-stats-end`.
#
# Runs daily; also runnable by hand from Actions -> Run workflow.
#
# Idempotent: a release body is written back only when the rendered numbers
# actually changed, so a quiet day issues no release edits at all.
#
# Only the marker block is rewritten. Everything else in an existing body —
# including one that fix-release-notes.yml regenerated by hand — is preserved
# byte for byte.
on:
  schedule:
    # 03:17 UTC (11:17 Beijing time). Deliberately offset from the top of the
    # hour, where every scheduled GitHub job fires, and far from the window in
    # which a tag is normally pushed, so this job never competes with a
    # running release pipeline for the API.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      releases:
        description: 'How many newest releases to refresh (0 = every non-draft release)'
        required: false
        default: '10'
        type: string

permissions:
  contents: write  # gh release edit rewrites the release body

concurrency:
  group: release-stats
  cancel-in-progress: false

jobs:
  refresh:
    name: Render download counts into release bodies
    runs-on: ubuntu-latest
    # No actions/checkout: this job reads and writes releases through the API
    # only, so it needs no working tree and costs no clone.
    steps:
      - name: Collect release assets and their download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : > pages.jsonl
          page=1
          # Walk every page explicitly. `gh api --paginate --jq` applies the
          # filter page by page and concatenates the results, which for an
          # array-producing filter would emit `[...][...]` — not valid JSON.
          # Collecting one compact object per line and slurping at the end
          # keeps the multi-line `body` field intact.
          while :; do
            batch=$(gh api "repos/${GH_REPO}/releases?per_page=100&page=${page}" \
              --jq '.[] | select(.draft == false) | {tag: .tag_name, body: .body, assets: [.assets[] | {name: .name, count: .download_count}]}')
            [ -z "$batch" ] && break
            printf '%s\n' "$batch" | jq -c '.' >> pages.jsonl
            page=$((page + 1))
          done
          jq -s '.' pages.jsonl > releases.json
          echo "collected $(jq 'length' releases.json) non-draft release(s)"

      - name: Render stats blocks
        env:
          # `inputs` is empty on a scheduled run, so the default is applied
          # here in the shell rather than in an expression.
          RELEASES: ${{ inputs.releases }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          START = "<!-- downloads-stats-start -->"
          END = "<!-- downloads-stats-end -->"
          # Checksum files are downloaded as part of verifying an installer, so
          # counting them alongside the installers double-counts one intent.
          EXCLUDED_SUFFIXES = (".sig",)
          EXCLUDED_NAMES = {"SHA256SUMS"}

          limit = int(os.environ.get("RELEASES") or 10)
          releases = json.load(open("releases.json"))
          if limit > 0:
              releases = releases[:limit]

          out = pathlib.Path("out")
          out.mkdir(exist_ok=True)
          todo = []
          for index, rel in enumerate(releases):
              tag = rel["tag"]
              body = rel.get("body") or ""
              assets = [
                  a
                  for a in rel.get("assets", [])
                  if a["name"] not in EXCLUDED_NAMES
                  and not a["name"].endswith(EXCLUDED_SUFFIXES)
              ]
              if not assets:
                  print(f"skip {tag}: no countable assets")
                  continue

              assets.sort(key=lambda a: (-a["count"], a["name"]))
              total = sum(a["count"] for a in assets)
              rows = ["### 📊 Download counts", "", "| Asset | Downloads |", "| --- | ---: |"]
              rows += [f"| `{a['name']}` | {a['count']} |" for a in assets]
              rows += [f"| **Total** | **{total}** |", ""]
              rows.append("_Refreshed daily from the release asset counters._")
              block = "\n".join([START] + rows + [END])

              if START in body and END in body:
                  head, rest = body.split(START, 1)
                  _, tail = rest.split(END, 1)
                  new = head + block + tail
              elif body.strip():
                  new = body.rstrip() + "\n\n" + block + "\n"
              else:
                  new = block + "\n"

              if new == body:
                  print(f"unchanged {tag}: total {total}")
                  continue

              path = out / f"rel-{index}.md"
              path.write_text(new, encoding="utf-8")
              todo.append((tag, str(path)))
              print(f"update {tag}: total {total}")

          with open("todo.tsv", "w", encoding="utf-8") as fh:
              for tag, path in todo:
                  fh.write(f"{tag}\t{path}\n")
          print(f"planned {len(todo)} release body edit(s)")
          PY

      - name: Write updated bodies back to the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s todo.tsv ]; then
            echo "no release body changed; nothing to write back."
            exit 0
          fi
          {
            echo "### Download counts refreshed"
            echo ""
            echo "| Release | Downloads |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r tag path; do
            [ -z "$tag" ] && continue
            gh release edit "$tag" --notes-file "$path"
            # The rendered block's Total row is the last "**…**" figure.
            # `|| true`: a body without a Total row must not trip `set -e`
            # here — the summary line just reports 0.
            total=$(grep -o '\*\*Total\*\* | \*\*[0-9]*\*\*' "$path" | grep -o '[0-9]*' | tail -1 || true)
            echo "| $tag | ${total:-0} |" >> "$GITHUB_STEP_SUMMARY"
            echo "refreshed $tag"
          done < todo.tsv
