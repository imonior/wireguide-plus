name: Refresh release notes

# One-off utility: overwrite the release body of an already-published tag with
# the curated, English-by-default CHANGELOG.md via `gh release edit`. Run
# manually via Actions -> "Refresh release notes" (e.g. to fix a release whose
# body was left in the wrong language).
#
#   tag input: the tag whose body should be regenerated (default v1.1.1).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag whose release body should be regenerated (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # git-cliff needs full history + tags to compute the commit range
          # since the previous release.
          fetch-depth: 0

      - name: Ensure input tag is the latest tag
        # git-cliff renders ALL version sections by default; a release body
        # must contain only the latest one, so this workflow only supports
        # refreshing the latest tag (same --latest mode release.yml uses).
        run: |
          latest="$(git describe --tags --abbrev=0)"
          echo "latest tag: $latest"
          if [ "$latest" != "${{ inputs.tag }}" ]; then
            echo "::error::'${{ inputs.tag }}' is not the latest tag ('$latest'). Refresh only supports the latest tag."
            exit 1
          fi

      # Use the curated, English-by-default CHANGELOG.md as the release body.
      # We no longer regenerate from git-cliff (its output followed commit
      # subject language, so a Chinese commit made the notes Chinese).
      - name: Overwrite release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag }}" --notes-file CHANGELOG.md
